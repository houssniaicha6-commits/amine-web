<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amine Restaurant</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
            background: #1a1a1a;
        }

        header h1 {
            color: #00e5ff;
        }

        .hero {
            padding: 100px 20px;
        }

        .hero h2 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #aaa;
            font-size: 18px;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #00e5ff;
            color: #111;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .menu {
            padding: 60px 20px;
        }

        .menu-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .food {
            background: #1a1a1a;
            padding: 25px;
            width: 220px;
            border-radius: 15px;
        }

        .food h3 {
            color: #00e5ff;
        }

        footer {
            padding: 25px;
            background: #1a1a1a;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>AMINE RESTAURANT</h1>
    </header>

    <section class="hero">
        <h2>Delicious Food</h2>
        <p>Fresh meals made with passion.</p>
        <a href="#menu" class="btn">View Menu</a>
    </section>

    <section class="menu" id="menu">
        <h2>Our Menu</h2>

        <div class="menu-container">

            <div class="food">
                <h3>Pizza</h3>
                <p>Fresh homemade pizza.</p>
            </div>

            <div class="food">
                <h3>Burger</h3>
                <p>Juicy premium burger.</p>
            </div>

            <div class="food">
                <h3>Pasta</h3>
                <p>Delicious Italian pasta.</p>
            </div>

        </div>
    </section>

    <footer>
        © 2026 Amine Restaurant
    </footer>

</body>
</html>
