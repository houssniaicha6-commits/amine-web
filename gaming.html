<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amine Gaming</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #15151d;
        }

        header h1 {
            color: #00e5ff;
            margin: 0;
        }

        .hero {
            padding: 90px 20px;
        }

        .hero h2 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #aaa;
            font-size: 18px;
        }

        .games {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 40px 20px;
        }

        .game {
            width: 230px;
            background: #15151d;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #00e5ff33;
        }

        .game-icon {
            font-size: 50px;
        }

        .game h3 {
            color: #00e5ff;
            font-size: 24px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #00e5ff;
            color: #111;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>AMINE GAMING</h1>
    </header>

    <section class="hero">
        <h2>LEVEL UP YOUR GAME</h2>
        <p>Discover gaming content, news and more.</p>
    </section>

    <section class="games">

        <div class="game">
            <div class="game-icon">🎮</div>
            <h3>Action Games</h3>
            <p>Fast and exciting gaming experience.</p>
            <a href="#" class="btn">Explore</a>
        </div>

        <div class="game">
            <div class="game-icon">🏆</div>
            <h3>Esports</h3>
            <p>Competitive gaming and tournaments.</p>
            <a href="#" class="btn">Explore</a>
        </div>

        <div class="game">
            <div class="game-icon">🔥</div>
            <h3>Game News</h3>
            <p>Latest news from the gaming world.</p>
            <a href="#" class="btn">Explore</a>
        </div>

    </section>

</body>
</html>
